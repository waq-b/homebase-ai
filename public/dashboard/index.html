<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homebase Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="hb-app" style="display:grid;grid-template-columns:220px 1fr;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)">

  <div style="border-right:2px solid var(--color-divider);display:flex;flex-direction:column;background:var(--color-bg)">
    <div style="padding:18px 16px;border-bottom:2px solid var(--color-divider)">
      <div style="font-family:var(--font-heading);font-weight:800;font-size:17px;letter-spacing:-0.02em">HOMEBASE</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:6px">
        <span id="status-dot" style="width:7px;height:7px;background:var(--color-neutral-400);display:inline-block"></span>
        <span id="status-text" class="hb-mono" style="font-size:11px;color:var(--color-neutral-700)">checking…</span>
      </div>
    </div>
    <nav id="nav" style="padding:10px 0;flex:1"></nav>
    <div style="padding:12px 16px;border-top:2px solid var(--color-divider)" class="hb-mono">
      <div style="font-size:10px;color:var(--color-neutral-600);text-transform:uppercase;letter-spacing:.06em">local gateway</div>
      <div id="base-url" style="font-size:11px;color:var(--color-neutral-700);margin-top:3px"></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;min-width:0">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:2px solid var(--color-divider)">
      <div>
        <div id="section-title" style="font-family:var(--font-heading);font-weight:800;font-size:20px"></div>
        <div id="section-subtitle" style="font-size:12px;color:var(--color-neutral-700);margin-top:2px"></div>
      </div>
      <div id="section-actions"></div>
    </div>
    <div id="section-body" class="hb-scroll" style="flex:1;padding:24px 28px"></div>
  </div>

  <div id="dialog-root"></div>
</div>

<script src="app.js"></script>
</body>
</html>
