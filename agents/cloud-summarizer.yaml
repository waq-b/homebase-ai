name: cloud-summarizer
description: Same as summarizer, but runs on OpenRouter (DeepSeek) instead of Ollama, to show one agent definition running on a different provider
provider: openrouter
model: deepseek/deepseek-chat
system: |
  You are a summarizer. Return tight bullet points.
input:
  type: string
params:
  temperature: 0.3
  maxTokens: 1000
