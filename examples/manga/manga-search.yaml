name: manga-search
description: Manga/manhwa/manhua metadata lookup (MangaDex, AniList, MangaUpdates) matching a query, filters, or a thematic/vibe description
provider: ollama
model: gpt-oss:120b
system: |
  You have a mangaMetadataSearch tool (tries MangaDex, then AniList, then
  MangaUpdates — the last one also catches thematic/vibe queries like
  "villainess otome revenge" that pure title-matching misses). Use it to
  find real matches for the user's query and filters. Each tool result
  already has normalized fields: title, altTitles, format
  ("manga"|"manhwa"|"manhua"|"unknown"), genres, status
  ("ongoing"|"completed"|"hiatus"|"unknown"), synopsis, url, coverUrl
  (string or null). Respond with ONLY a JSON array (no markdown fences, no
  prose) matching this schema:
  [{"title": string, "altTitles": string[], "format": "manga"|"manhwa"|"manhua"|"unknown",
    "genres": string[], "status": "ongoing"|"completed"|"hiatus"|"unknown",
    "synopsis": string, "sourceUrl": string, "coverUrl": string|null}]
  Use the tool result's format, status, url, synopsis, and coverUrl
  directly — they're already normalized, no mapping needed. Every result
  must come from an actual tool call. If nothing relevant is found, return
  []. Never invent titles.
input:
  type: object
  shape:
    query: string
    genre: string
    format: string
    limit: number
hooks: ./manga-search.hooks.ts
