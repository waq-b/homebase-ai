name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Excludes *.integration.test.ts (they call the real Voyage embeddings
      # API and need credentials this runner doesn't have) — see README.
      - run: npm run test:unit

  homebase-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homebase-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: homebase-client/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
